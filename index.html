<!doctype html>
<html lang="sv"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Skåne Sweden Roleplay – Adminpanel</title><link rel="stylesheet" href="style.css"></head>
<body><main class="container"><section id="login" class="card"><h1>Skåne Sweden Roleplay</h1><p>Adminpanel</p><button id="discordLogin">Logga in med Discord</button><small>Endast användare med rätt Discord-behörighet får administrera servern.</small></section>
<section id="panel" class="card hidden"><div class="topbar"><div><h1>Adminpanel</h1><p id="userInfo">Inte inloggad</p></div><button id="logout" class="secondary">Logga ut</button></div><div class="grid"><div class="box"><h2>Server</h2><p id="serverStatus">Kontrollerar status...</p></div><div class="box"><h2>Banna spelare</h2><input id="playerId" placeholder="Roblox User ID"><input id="reason" placeholder="Anledning"><button id="banButton" class="danger">Banna</button></div><div class="box"><h2>Unbanna</h2><input id="unbanId" placeholder="Roblox User ID"><button id="unbanButton">Unbanna</button></div><div class="box"><h2>Aktiva bans</h2><button id="refreshBans">Uppdatera banlista</button><pre id="banList">Ingen data ännu.</pre></div></div></section></main><script src="config.js"></script><script src="app.js"></script></body></html>
